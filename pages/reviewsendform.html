<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Send</title>
</head>
<style>
  
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: linear-gradient(135deg, #89f7fe, #66a6ff);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}


.review-form {
  background: white;
  padding: 40px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  width: 350px;
}


#milk-request {
  display: flex;
  flex-direction: column;
  gap: 15px;
  
}

label {
  font-weight: 600;
  color: #333;
}


input {
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 15px;
  transition: 0.3s;
}


input:focus {
  outline: none;
  border-color: #66a6ff;
  box-shadow: 0 0 5px rgba(102,166,255,0.5);
}


button {
  margin-top: 10px;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #66a6ff;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #4a90e2;
}

#donorName{
  color:#4a90e2;
 
}
#donorName img{
margin-left: 50px;
}
#donorLocation img{
margin-left: 50px;
}
#donorLocation{
  color: #4a90e2;
}


</style>
<body>
  
    <section class="review-form">
      
      <h2 id="donorName">Donar Name :<img src="../assets/image.png" alt="" height="30px" width="30px"> </h2>
      <h3 id="donorLocation">Donar Location :<img src="../assets/image.png" alt="" height="30px" width="30px"></h3  >
      
   <form id="milk-request">

    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Enter your name" required >

    <label for="phone">Phone</label>
    <input type="text" id="phone" placeholder="Mobile number" required maxlength="10">

    <label for="email">Email</label>
    <input type="email" id="email"placeholder="Your Email id" required>

    <label for="message">Message(optional)</label>
    <input type="text" id="message" >

    <button>Submit</button>


   </form>
    </section>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script type="module">

// firebase import
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, doc, getDoc }

from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
let donorEmail = "";
// config
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "thaaimaicare-donate-form.firebaseapp.com",
  projectId: "thaaimaicare-donate-form",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// URL la id eduthu
const params = new URLSearchParams(window.location.search);
const donorId = params.get("id");

// donor fetch
async function loadDonor() {
  const docRef = doc(db, "users", donorId);
  const docSnap = await getDoc(docRef);

  if(docSnap.exists()){
    const data = docSnap.data();

   
      document.getElementById("donorName").textContent =
        "Donor Name: " + data.name;
  
      document.getElementById("donorLocation").textContent =
        "Location: " + data.location;
  
      donorEmail = data.email;
    
  }
}

loadDonor();
emailjs.init("u-6Nn4TQLR499YjXd");

document.getElementById("milk-request")
.addEventListener("submit", function(e){

  e.preventDefault();

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  const message = document.getElementById("message").value;

  if (!name || !email || !phone ) {
    alert("Please fill all required fields");
    return;
  }

  const templateParams = {
    to_email: donorEmail, // donor ku pogum
    from_name: name,
    from_email: email,
    phone: phone,
    message: message
  };

  emailjs.send("service_mttbasm", "template_bncv3z6", templateParams)
  .then(()=>{
    alert("Message sent to donor ");
    document.getElementById("milk-request").reset();
  })
  .catch(error=>{
    console.log(error);
    alert("Failed to send email ");
  });

});

</script>




</body>
</html>
