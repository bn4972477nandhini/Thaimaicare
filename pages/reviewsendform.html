<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Send</title>
</head>
<style>
  
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: linear-gradient(135deg, #89f7fe, #66a6ff);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}


.review-form {
  background: white;
  padding: 40px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  width: 350px;
}


#milk-reviews {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

label {
  font-weight: 600;
  color: #333;
}


input {
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 15px;
  transition: 0.3s;
}


input:focus {
  outline: none;
  border-color: #66a6ff;
  box-shadow: 0 0 5px rgba(102,166,255,0.5);
}


button {
  margin-top: 10px;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #66a6ff;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #4a90e2;
}
</style>
<body>
    <section class="review-form">
   <form id="milk-reviews">

    <label for="name">Name</label>
    <input type="text" id="name" >

    <label for="phone">Phone</label>
    <input type="text" id="phone">

    <label for="email">Email</label>
    <input type="text" id="email">

    <label for="message">Message</label>
    <input type="text" id="message">
   </form>
    </section>
</body>
</html>
